  <!-- Mayo/cream drizzle on top -->
  <path d="M68,58 C75,48 88,44 100,46 C112,44 122,50 128,58 C118,52 108,50 100,52 C92,50 80,54 68,58 Z" fill="white" opacity="0.92"/>
  <path d="M74,54 C82,44 95,40 104,43 C112,41 120,47 126,55 C116,49 106,47 100,49 C94,47 84,50 74,54 Z" fill="rgba(255,255,255,0.7)"/>
  <!-- Mayo drip left -->
  <path d="M78,56 C75,62 73,70 76,78 C78,70 80,62 78,56 Z" fill="white" opacity="0.85"/>
  <!-- Mayo drip right -->
  <path d="M118,57 C121,63 122,72 119,80 C117,72 116,63 118,57 Z" fill="white" opacity="0.85"/>
  <!-- Mayo center drip -->
  <path d="M100,47 C98,55 97,65 99,74 C101,65 102,55 100,47 Z" fill="white" opacity="0.8"/>
  <!-- Mayo highlight -->
  <ellipse cx="100" cy="50" rx="18" ry="5" fill="rgba(255,255,255,0.5)"/>
