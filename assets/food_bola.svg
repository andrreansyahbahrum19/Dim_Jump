  <!-- Crispy texture bumps -->
  <circle cx="72" cy="75" r="9" fill="#D07808" opacity="0.45"/>
  <circle cx="96" cy="65" r="7" fill="#C86E06" opacity="0.4"/>
  <circle cx="120" cy="78" r="10" fill="#D07808" opacity="0.4"/>
  <circle cx="80" cy="100" r="8" fill="#C06800" opacity="0.35"/>
  <circle cx="116" cy="105" r="9" fill="#D07808" opacity="0.4"/>
  <circle cx="90" cy="122" r="8" fill="#C06800" opacity="0.35"/>
  <circle cx="115" cy="130" r="7" fill="#C86E06" opacity="0.35"/>
  <circle cx="68" cy="118" r="7" fill="#C06800" opacity="0.3"/>
  <circle cx="128" cy="90" r="6" fill="#D07808" opacity="0.35"/>
  <!-- Inner texture detail -->
  <circle cx="84" cy="88" r="4" fill="#B86000" opacity="0.3"/>
  <circle cx="108" cy="92" r="4" fill="#B86000" opacity="0.28"/>
