<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="65" ry="14" fill="rgba(0,0,0,0.18)"/>

  <!-- Body - golden crispy roll cylinder -->
  <!-- Main body ellipse rotated -->
  <g transform="rotate(-18, 100, 100)">
    <!-- Back cap -->
    <ellipse cx="148" cy="88" rx="24" ry="34" fill="#B86A00"/>
    <!-- Cylinder body -->
    <rect x="50" y="54" width="98" height="68" fill="#D4820A" rx="4"/>
    <!-- Texture lines on cylinder -->
    <line x1="68" y1="54" x2="68" y2="122" stroke="#C07008" stroke-width="2.5" opacity="0.7"/>
    <line x1="85" y1="54" x2="85" y2="122" stroke="#C07008" stroke-width="2.5" opacity="0.7"/>
    <line x1="102" y1="54" x2="102" y2="122" stroke="#C07008" stroke-width="2.5" opacity="0.7"/>
    <line x1="119" y1="54" x2="119" y2="122" stroke="#C07008" stroke-width="2.5" opacity="0.7"/>
    <line x1="136" y1="54" x2="136" y2="122" stroke="#C07008" stroke-width="2.5" opacity="0.7"/>
    <!-- Diagonal crispy texture -->
    <line x1="60" y1="60" x2="140" y2="75" stroke="#E8940E" stroke-width="1.5" opacity="0.5"/>
    <line x1="60" y1="78" x2="140" y2="93" stroke="#E8940E" stroke-width="1.5" opacity="0.5"/>
    <line x1="60" y1="96" x2="140" y2="111" stroke="#E8940E" stroke-width="1.5" opacity="0.5"/>
    <!-- Front cap -->
    <ellipse cx="52" cy="88" rx="24" ry="34" fill="#F0A020"/>
    <!-- Front cap texture/dots -->
    <circle cx="52" cy="78" r="4" fill="#E89010" opacity="0.5"/>
    <circle cx="44" cy="90" r="3" fill="#E89010" opacity="0.4"/>
    <circle cx="60" cy="95" r="3.5" fill="#E89010" opacity="0.4"/>
    <!-- Highlight -->
    <ellipse cx="52" cy="72" rx="10" ry="6" fill="rgba(255,220,120,0.45)"/>
    <!-- Golden sheen on body -->
    <rect x="50" y="54" width="20" height="68" fill="url(#lg1)" rx="2"/>
  </g>
  <!-- Crispy dots on surface -->
  <circle cx="88" cy="90" r="3.5" fill="#C06808" opacity="0.5"/>
  <circle cx="112" cy="85" r="3" fill="#C06808" opacity="0.45"/>
  <circle cx="100" cy="108" r="3" fill="#C06808" opacity="0.4"/>
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,220,130,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,220,130,0)"/>
    </linearGradient>
  </defs>
</svg>
